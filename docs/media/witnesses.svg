<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" direction="rtl" font-family="Arial, Helvetica, sans-serif">
  <title>ארבעה עדים שנבדקים בכל עלייה</title>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="338" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2328">ארבעה עדים בכל עלייה</text>

  <rect x="690" y="70" width="190" height="120" rx="12" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <text x="785" y="112" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2328">קובץ המצב</text>
  <text x="785" y="142" text-anchor="middle" font-size="15" fill="#1f2328">במחשב</text>

  <rect x="480" y="70" width="190" height="120" rx="12" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <text x="575" y="112" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2328">משתנה גלובלי</text>
  <text x="575" y="142" text-anchor="middle" font-size="15" fill="#1f2328">בטרמינל</text>

  <rect x="270" y="70" width="190" height="120" rx="12" fill="#e3eefc" stroke="#1565c0" stroke-width="2"/>
  <text x="365" y="112" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">היסטוריית עסקאות</text>
  <text x="365" y="142" text-anchor="middle" font-size="15" fill="#1f2328">בשרת הברוקר</text>
  <text x="365" y="168" text-anchor="middle" font-size="15" fill="#1f2328">לא נמחקת מהמחשב</text>

  <rect x="60" y="70" width="190" height="120" rx="12" fill="#e3eefc" stroke="#1565c0" stroke-width="2"/>
  <text x="155" y="112" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">הסגירות של השומר</text>
  <text x="155" y="142" text-anchor="middle" font-size="15" fill="#1f2328">בשרת הברוקר</text>
  <text x="155" y="168" text-anchor="middle" font-size="15" fill="#1f2328">לא נמחקות מהמחשב</text>

  <line x1="785" y1="194" x2="785" y2="244" stroke="#57606a" stroke-width="3" marker-end="url(#head)"/>
  <line x1="575" y1="194" x2="575" y2="244" stroke="#57606a" stroke-width="3" marker-end="url(#head)"/>
  <line x1="365" y1="194" x2="365" y2="244" stroke="#57606a" stroke-width="3" marker-end="url(#head)"/>
  <line x1="155" y1="194" x2="155" y2="244" stroke="#57606a" stroke-width="3" marker-end="url(#head)"/>

  <rect x="60" y="252" width="820" height="64" rx="12" fill="#fde2e1" stroke="#c62828" stroke-width="3"/>
  <text x="470" y="292" text-anchor="middle" font-size="21" font-weight="bold" fill="#b71c1c">עד אחד מספיק כדי לנעול. המחמיר מנצח.</text>
</svg>
