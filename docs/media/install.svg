<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" direction="rtl" font-family="Arial, Helvetica, sans-serif">
  <title>התקנה בארבעה צעדים: הורדה, לחיצה כפולה, הידור, חיבור לגרף</title>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="258" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2328">התקנה בארבעה צעדים</text>

  <rect x="695" y="80" width="175" height="140" rx="12" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <circle cx="782" cy="80" r="17" fill="#1565c0"/>
  <text x="782" y="87" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">1</text>
  <text x="782" y="135" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2328">הורדה</text>
  <text x="782" y="165" text-anchor="middle" font-size="15" fill="#1f2328">מורידים ומחלצים</text>
  <text x="782" y="187" text-anchor="middle" font-size="15" fill="#1f2328">לתיקייה אחת</text>

  <rect x="470" y="80" width="175" height="140" rx="12" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <circle cx="557" cy="80" r="17" fill="#1565c0"/>
  <text x="557" y="87" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">2</text>
  <text x="557" y="135" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2328">לחיצה כפולה</text>
  <text x="557" y="165" text-anchor="middle" font-size="15" fill="#1f2328">על קובץ ההתקנה</text>
  <text x="557" y="187" text-anchor="middle" font-size="15" fill="#1f2328">תשע בדיקות קודם</text>

  <rect x="245" y="80" width="175" height="140" rx="12" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <circle cx="332" cy="80" r="17" fill="#1565c0"/>
  <text x="332" y="87" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">3</text>
  <text x="332" y="135" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2328">הידור</text>
  <text x="332" y="165" text-anchor="middle" font-size="15" fill="#1f2328">מהדר ומעתיק</text>
  <text x="332" y="187" text-anchor="middle" font-size="15" fill="#1f2328">קובץ אחד לטרמינל</text>

  <rect x="20" y="80" width="175" height="140" rx="12" fill="#dff5e3" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="107" cy="80" r="17" fill="#2e7d32"/>
  <text x="107" y="87" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">4</text>
  <text x="107" y="135" text-anchor="middle" font-size="21" font-weight="bold" fill="#1b5e20">חיבור לגרף</text>
  <text x="107" y="165" text-anchor="middle" font-size="15" fill="#1f2328">גוררים את השומר</text>
  <text x="107" y="187" text-anchor="middle" font-size="15" fill="#1f2328">לגרף אחד, ביד</text>

  <line x1="690" y1="150" x2="652" y2="150" stroke="#57606a" stroke-width="3" marker-end="url(#head)"/>
  <line x1="465" y1="150" x2="427" y2="150" stroke="#57606a" stroke-width="3" marker-end="url(#head)"/>
  <line x1="240" y1="150" x2="202" y2="150" stroke="#57606a" stroke-width="3" marker-end="url(#head)"/>
</svg>
